<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Repertorio de Libros</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2>Repertorio de Libros</h2>
		<a th:href="@{/inicio}" class="btn btn-secondary">Volver al Inicio</a>
	</div>

	<table class="table table-striped table-hover shadow-sm">
		<thead class="table-dark">
			<tr>
				<th scope="col">Código</th>
				<th scope="col">Imagen</th>
				<th scope="col">Título</th>
				<th scope="col">Autor</th>
				<th scope="col">Género</th>
				<th scope="col">Año</th>
				<th scope="col">Editorial</th>
				<th scope="col">Sinopsis</th>
				<th scope="col">Estado</th>
				<th scope="col"></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="l : ${lstLibros}">
				<td th:text="${l.codigo}"></td>
				<td>
					<img th:src="${l.imagen}" width="50" height="75" alt="Portada">
				</td>
				<td th:text="${l.nombre}"></td>
				<td th:text="${l.autor}"></td>
				<td th:text="${l.obj_genero != null ? l.obj_genero.nomGenero : 'No definido'}"></td>
				<td th:text="${l.anio}"></td>
				<td th:text="${l.editorial}"></td>
				<td th:text="${l.sinopsis}"></td>
				<td>
					<span th:if="${l.estadoLibro == 1}" class="badge bg-success">Disponible</span>
					<span th:if="${l.estadoLibro == 0}" class="badge bg-danger">No Disponible</span>
				</td>

				<td>
					<a href="/reservas/nueva" class="btn btn-sm btn-primary">Reservar</a>
				</td>
			</tr>
		</tbody>
	</table>
</body>

</html>
