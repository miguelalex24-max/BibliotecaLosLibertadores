<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Nueva Reserva - Sistema Bibliotecario</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/estilosinicio.css}">

</head>

<body class="container mt-5" style="max-width: 600px;">
	<h3 class="mb-4">Registrar Nueva Reserva</h3>
	<form action="/reservas" method="get" class="card card-body shadow-sm">
		<div class="mb-3">
			<label class="form-label">Código de Libro / Título:</label>
			<input type="text" class="form-control" placeholder="Ej. Cien Años de Soledad" required>
		</div>
		<div class="mb-3">
			<label class="form-label">Fecha de Préstamo:</label>
			<input type="date" class="form-control" required>
		</div>
		<div class="mb-3">
			<label class="form-label">Fecha de Devolución:</label>
			<input type="date" class="form-control" required>
		</div>
		<div class="d-flex justify-content-between">
			<a href="/reservas" class="btn btn-secondary">Cancelar</a>
			<button type="submit" class="btn btn-primary">Guardar Reserva</button>
		</div>
	</form>
</body>
</html>
