<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Ticket de Atencion - Sistema Bibliotecario</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/estilosinicio.css}">

</head>
<body class="container mt-5" style="max-width: 600px;">
	<h3 class="mb-4">Generar Nuevo Ticket</h3>

	<form th:action="@{/tickets/guardar}" method="post"
		class="card card-body shadow-sm">
		<div class="mb-3">
			<label class="form-label" for="asunto">Asunto:</label> <input
				type="text" id="asunto" name="asunto" class="form-control"
				maxlength="100" placeholder="Escribe el asunto de tu consulta"
				required>
		</div>
		<div class="mb-3">
			<label class="form-label" for="descripcion">Descripción:</label>
			<textarea id="descripcion" name="descripcion" class="form-control"
				rows="4" maxlength="500"
				placeholder="Detalla la consulta o problema que presentas..."
				required></textarea>
		</div>
		<div class="d-flex justify-content-between">
			<a th:href="@{/tickets}" class="btn btn-secondary">Cancelar</a>
			<button type="submit" class="btn btn-success">Guardar Ticket</button>
		</div>
	</form>
</body>

<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	
</script>
</html>
