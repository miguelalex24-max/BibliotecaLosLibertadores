
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registro - Sistema Bibliotecario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100">

    <div class="card bg-secondary text-white p-4" style="width: 400px; max-width: 95%;">

        <h3 class="text-center mb-3">Registrarse</h3>

        <!-- MENSAJE DE RESULTADO -->
        <div th:if="${mensaje != null}"
             th:text="${mensaje}"
             th:class="${tipoMensaje == 'exito'} 
                 ? 'alert alert-success' 
                 : 'alert alert-danger'"
             role="alert">
        </div>

        <!-- FORMULARIO: SOLO DEBE EXISTIR UNO -->
        <form th:action="@{/registro}"
              th:object="${usuario}"
              method="post">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control"
                       th:field="*{nomUsuario}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control"
                       th:field="*{apeUsuario}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">DNI</label>
                <input type="text" class="form-control"
                       th:field="*{dniUsuario}"
                       maxlength="8" pattern="[0-9]{8}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-control"
                       th:field="*{tlfUsuario}"
                       maxlength="9"
                       placeholder="Ingrese su teléfono" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control"
                       th:field="*{correoUsuario}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control"
                       th:field="*{passwordUsuario}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Registrarse
            </button>

        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}"
               class="text-white text-decoration-none">Regresar al login</a>
        </div>

    </div>

</body>
</html>
