<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Inicio - Sistema Bibliotecario "Los Libertadores"</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
	crossorigin="anonymous">

</head>
<body>

	<nav class="navbar sm:navbar-expand bg-1 fg-2">
		<div class="container-fluid">
			<a class="navbar-brand" href="/inicio">Inicio</a>
			<button class="btn-icon navbar-toggler" type="button"
				data-bs-toggle="drawer" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon" aria-hidden="true"></span>
			</button>
			<dialog class="drawer drawer-end" tabindex="-1" id="navbarNav"
				aria-labelledby="navbarNavLabel">
			<div class="drawer-header">
				<h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
				<button type="button" class="btn-close" data-bs-dismiss="drawer"
					aria-label="Close"></button>
			</div>
			<div class="drawer-body">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link"
						href="/libros/repertorio">Repertorio de libros</a></li>
					<li class="nav-item"><a class="nav-link" href="/tickets">Generar
							ticket</a></li>
					<li class="nav-item"><a class="nav-link" href="/reservas">Reservar
							libros</a></li>
					<li class="nav-item"><a class="nav-link text-danger"
						href="/logout">Cerrar sesion</a></li>
				</ul>
			</div>
			</dialog>
		</div>
	</nav>

	<!-- AQUÍ VA EL CONTENIDO PARA QUE NO SE VEA NEGRO / VACÍO -->
	<div class="container mt-5">
		<div class="p-5 mb-4 bg-light text-dark rounded-3 shadow-sm">
			<div class="container-fluid py-3">
				<h1 class="display-5 fw-bold">Bienvenido al Sistema
					Bibliotecario</h1>
				<p class="fs-5">Selecciona una de las opciones del menú superior
					para consultar el repertorio de libros, gestionar tus tickets o
					administrar tus reservas.</p>
			</div>
		</div>
	</div>

</body>

<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
