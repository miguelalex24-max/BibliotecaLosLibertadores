<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Iniciar Sesión - Sistema Bibliotecario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">

    <div class="card bg-secondary text-white p-4" style="width: 400px;">
        <h3 class="text-center mb-3">Iniciar Sesión</h3>
        
        <!-- Mensaje de error si las credenciales fallan -->
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        
        <!-- Formulario sin th:object para evitar que el controlador requiera el objeto usuario -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" name="correo" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-light w-100">Entrar</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="/registro" class="text-white-50 text-decoration-none">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>

</body>
</html>
